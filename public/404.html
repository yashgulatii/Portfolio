<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Page not found | Yash Gulati</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", Arial, sans-serif;
        color: #2b2b2b;
        background: #f3efe3;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background-color: #f3efe3;
        background-image:
          linear-gradient(rgba(99, 157, 184, .18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 157, 184, .18) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      main {
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid rgba(43, 43, 43, .4);
        background: rgba(243, 239, 227, .94);
        box-shadow: 0 2px 8px rgba(43, 43, 43, .1);
      }
      h1 { margin: 0 0 24px; font-size: clamp(32px, 8vw, 48px); }
      a { color: #1d3fb8; font: 14px/1.5 "IBM Plex Mono", monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
